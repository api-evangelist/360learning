  (create/update/delete), or bulk (bulk operations). Scopes operate at two
  levels: company-level (the permission ceiling, changed via Customer Success
  Partner) and credential-level (a subset assigned per API credential).
  The 360Learning OpenAPI declares an oauth2 scheme with empty flows; the
  scope each endpoint requires is documented in its operation description and
  enforced at request time (403 invalid_scope on failure).
