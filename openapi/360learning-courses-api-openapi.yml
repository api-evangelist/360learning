                      required:
                      - code
                      - message
                  required:
                  - error
        '429':
          description: The client has sent too many requests in a short amount of time. This endpoint has a specific rate limit of 1 requests per second.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - tooManyRequests
                required:
                - error
