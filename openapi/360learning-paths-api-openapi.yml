                      properties:
                        code:
                          type: string
                          enum:
                          - classroomStepNotFound
                        message:
                          type: string
                          example: A human-readable message to help with debugging.
                      required:
                      - code
                      - message
                  required:
                  - error
                - description: The given course step does not correspond to any existing course.
                  title: Course Step Not Found
                  type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - courseStepNotFound
                        message:
                          type: string
                          example: A human-readable message to help with debugging.
                      required:
                      - code
                      - message
                  required:
                  - error
                - description: The given email step does not correspond to any existing email.
                  title: Email Step Not Found
                  type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - emailStepNotFound
                        message:
                          type: string
                          example: A human-readable message to help with debugging.
                      required:
