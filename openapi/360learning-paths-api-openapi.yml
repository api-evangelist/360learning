      type: object
      properties:
        optional:
          type: boolean
          description: True if the step is optional to complete the path; false otherwise.
        relativeDate:
          description: A soft deadline to encourage learners to complete the step on time, calculated from their enrollment date. Learners can still play the step after the relative due date.
          allOf:
          - $ref: '#/components/schemas/RelativeDateOptionDTO'
        showCorrection:
          type: string
          enum:
