                - description: The given path step does not correspond to any existing path.
                  title: Path Step Not Found
                  type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - pathStepNotFound
                        message:
                          type: string
                          example: A human-readable message to help with debugging.
                      required:
                      - code
                      - message
                  required:
                  - error
                - description: The given program step does not correspond to any existing program.
                  title: Program Step Not Found
                  type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - programStepNotFound
                        message:
                          type: string
                          example: A human-readable message to help with debugging.
                      required:
                      - code
                      - message
                  required:
                  - error
                - description: The given slackMessage step does not correspond to any existing slackMessage.
                  title: Slack Message Step Not Found
                  type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - slackMessageStepNotFound
                        message:
                          type: string
                          example: A human-readable message to help with debugging.
                      required:
                      - code
                      - message
                  required:
                  - error
                - description: The given teamsMessage step does not correspond to any existing teamsMessage.
                  title: Teams Message Step Not Found
                  type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - teamsMessageStepNotFound
                        message:
                          type: string
                          example: A human-readable message to help with debugging.
                      required:
