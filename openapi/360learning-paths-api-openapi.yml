        '429':
          description: 'The client has sent too many requests in a short amount of time. '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - tooManyRequests
                required:
                - error
      security:
      - oauth2: []
      summary: Replace all steps
      tags:
      - Paths
components:
  schemas:
    SlackMessageStepDTO:
      title: Slack Message Step
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of the step resource.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        type:
          type: string
          enum:
          - slackMessage
          description: The type of the step.
        options:
          description: The options for this step.
          allOf:
          - $ref: '#/components/schemas/MessageStepOptionsDTO'
      required:
      - _id
      - type
      - options
    ArchivePathBody:
      title: Archive Path Body
      type: object
      properties:
        archived:
          type: boolean
          description: If true, archives the path. If false, restores the path.
      required:
      - archived
    SuccessfulStatus:
      title: Successful Status
      type: object
      properties:
        type:
          type: string
          enum:
          - successful
          description: 'The learner meets all the following conditions:

            - They have reached the minimum score in all the mandatory courses that require it.

            - They have completed all mandatory steps in the path within the time limits.


            If the path has the mandatory replay option activated, they must have completed all mandatory steps within the path session, even if they has previously completed the courses elsewhere.'
      required:
      - type
    SessionUserStatDTO:
      title: Session User Stat
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of the user enrollment.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        progress:
          type: integer
          description: The completion rate of the user as a percentage.
          minimum: 0
          maximum: 100
        status:
          oneOf:
          - $ref: '#/components/schemas/AwaitingCorrectionStatus'
          - $ref: '#/components/schemas/LateStatus'
          - $ref: '#/components/schemas/NotYetStartedStatus'
          - $ref: '#/components/schemas/OnTimeStatus'
          - $ref: '#/components/schemas/SessionNotOpenedStatus'
          - $ref: '#/components/schemas/SuccessfulStatus'
          - $ref: '#/components/schemas/ToRetakeStatus'
          - $ref: '#/components/schemas/UnsuccessfulStatus'
          description: The status of the user in the path session.
        timeSpent:
          type: number
          description: The number of milliseconds spent by the user on the session.
        userId:
          type: string
          description: The unique ID of the user.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        completedAt:
          format: date-time
          type: string
          description: The date and time of completion of the session, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        score:
          type: integer
          description: The score obtained by the user as a percentage.
          minimum: 0
          maximum: 100
        enrolledAt:
          format: date-time
          type: string
          description: The date and time the user was enrolled, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        unenrolledAt:
          format: date-time
          type: string
          description: The date and time the user was unenrolled, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        certificateId:
          type: string
          description: The ID of the certificate obtained by the user in the session.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        selfEnrolled:
          type: boolean
          description: True if the user self-enrolled in the given path session; false otherwise.
        startedAt:
          format: date-time
          type: string
          description: The date and time the user started working in the session, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        dueDate:
          format: date-time
          type: string
          description: The date and time when the session is due, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
      required:
      - _id
      - progress
      - status
      - timeSpent
      - userId
      - enrolledAt
      - selfEnrolled
    AvailabilityOptionDTO:
      title: Availability Option
      type: object
      properties:
        mode:
          type: string
          enum:
          - afterEnrollmentDate
          - afterSessionStartDate
          description: The event that triggers the start of the availability period.
        relativeDate:
          description: The period of availability.
          allOf:
          - $ref: '#/components/schemas/RelativeDateOptionDTO'
      required:
      - mode
      - relativeDate
    CourseStepDTO:
      title: Course Step
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of the step resource.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        type:
          type: string
          enum:
          - course
          description: The type of the step.
        options:
          oneOf:
          - $ref: '#/components/schemas/RegularCourseStepOptionsDTO'
          - $ref: '#/components/schemas/PositioningQuizCourseStepOptionsDTO'
          description: The options for this step.
        subtype:
          type: string
          enum:
          - quiz
          description: The subtype of the step.
      required:
      - _id
      - type
      - options
    SchedulingOptionDTO:
      title: Scheduling Option
      type: object
      properties:
        relativeTo:
          type: string
          enum:
          - afterEnrollmentDate
          - afterSessionStartDate
          - beforeSessionStartDate
          description: 'The event triggering the message scheduling. Options are:

            - `afterEnrollmentDate`: The message will be sent a specific number of days after the enrollment date.

            - `afterSessionStartDate`: The message will be sent a specific number of days after the session start date.

            - `beforeSessionStartDate`: The message will be sent a specific number of days before the session start date.'
        relativity:
          type: number
          minimum: 1
          maximum: 2000
          description: The number of days from the triggering event to send the message.
          example: 1
        condition:
          type: string
          enum:
          - completed
          - notCompleted
          - notSuccessful
          - successful
          description: 'The path result required to trigger the message. Note that this parameter only applies to the following triggering events: `afterEnrollmentDate` and `afterSessionStartDate`. Path results options are:

            - `completed`: The learner completed all steps in the path.

            - `notCompleted`: The learner has at least one uncompleted step in the path.

            - `notSuccessful`: The learner has at least one uncompleted step in the path, or has not reached the minimum score for at least one mandatory step.

            - `successful`: The learner has completed all mandatory steps in the path, reached the minimum score in all mandatory courses that have one, and completed them in less than the maximum time limit, or more than the minimum time limit.'
        conditionOnDetailedStatus:
          type: array
          description: 'The detailed path statuses required to trigger the message. Note that this parameter only applies to the following triggering events: `afterEnrollmentDate` and `afterSessionStartDate`. Detailed status options include:

            - `awaitingCorrection`: The learner is awaiting correction of at least one step in the path.

            - `late`: The learner is late on the path based on the relative date deadline.

            - `notYetStarted`: The learner has not yet started the path.

            - `onTime`: The learner is progressing through the path on time.

            - `successful`: The learner has successfully completed all mandatory steps in the path.

            - `toRetake`: The learner needs to retake one or more steps in the path.

            - `unsuccessful`: The learner has not successfully completed at least one of the required steps in the path.'
          items:
            type: string
            enum:
            - awaitingCorrection
            - late
            - notYetStarted
            - onTime
            - successful
            - toRetake
            - unsuccessful
      required:
      - relativeTo
      - relativity
    ClassroomStepDTO:
      title: Classroom Step
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of the step resource.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        type:
          type: string
          enum:
          - classroom
          description: The type of the step.
        options:
          description: The options for this step.
          allOf:
          - $ref: '#/components/schemas/ClassroomStepOptionsDTO'
      required:
      - _id
      - type
      - options
    ToRetakeStatus:
      title: To Retake Status
      type: object
      properties:
        type:
          type: string
          enum:
          - toRetake
          description: 'The path session is ongoing, the learner has started the path, and they meet at least one of the following conditions:

            - They have not reached the minimum score for at least one mandatory course, and they have not reached the maximum number of authorized attempts.

            - They have not completed the path within the time limits and they have not reached the maximum number of attempts for mandatory courses.

            - They completed at least one step outside the path context in a path that has the mandatory replay option activated.'
        reason:
          type: string
          enum:
          - mandatoryReplay
          description: The learner has not re-completed some mandatory steps previously completed outside the path.
      required:
      - type
    AggregatedSessionStatDTO:
      title: Aggregated Session Stat
      type: object
      properties:
        certificates:
          type: integer
          minimum: 0
          description: Number of certificates obtained within the session.
        usersCountByStatus:
          description: 'Number of users per detailed path status. Possible status are: awaitingCorrection, late, notYetStarted, onTime, sessionNotOpened, successful, toRetake, unsuccessful.'
          allOf:
          - $ref: '#/components/schemas/UsersCountByStatusDTO'
      required:
      - certificates
      - usersCountByStatus
    PathSessionUserStatDTO:
      title: Path Session User Stat
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of the user enrollment.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        progress:
          type: integer
          description: The completion rate of the user as a percentage.
          minimum: 0
          maximum: 100
        status:
          oneOf:
          - $ref: '#/components/schemas/AwaitingCorrectionStatus'
          - $ref: '#/components/schemas/LateStatus'
          - $ref: '#/components/schemas/NotYetStartedStatus'
          - $ref: '#/components/schemas/OnTimeStatus'
          - $ref: '#/components/schemas/SessionNotOpenedStatus'
          - $ref: '#/components/schemas/SuccessfulStatus'
          - $ref: '#/components/schemas/ToRetakeStatus'
          - $ref: '#/components/schemas/UnsuccessfulStatus'
          description: The status of the user in the path session.
        timeSpent:
          type: number
          description: The number of milliseconds spent by the user on the session.
        userId:
          type: string
          description: The unique ID of the user.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        completedAt:
          format: date-time
          type: string
          description: The date and time of completion of the session, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        score:
          type: integer
          description: The score obtained by the user as a percentage.
          minimum: 0
          maximum: 100
        enrolledAt:
          format: date-time
          type: string
          description: The date and time the user was enrolled, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        unenrolledAt:
          format: date-time
          type: string
          description: The date and time the user was unenrolled, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        certificateId:
          type: string
          description: The ID of the certificate obtained by the user in the session.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        selfEnrolled:
          type: boolean
          description: True if the user self-enrolled in the given path session; false otherwise.
        startedAt:
          format: date-time
          type: string
          description: The date and time the user started working in the session, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        dueDate:
          format: date-time
          type: string
          description: The date and time when the session is due, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        pathId:
          type: string
