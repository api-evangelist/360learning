          - groups
          description: The type of the session audience filter.
        ids:
          example:
          - 507f1f77bcf86cd799439011
          maxItems: 5000
          description: The list of unique IDs in the the audience filter.
          type: array
          items:
            type: string
            format: ObjectId
            pattern: ^[a-fA-F0-9]{24}$
