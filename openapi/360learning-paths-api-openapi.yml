          description: The type of automatic reenrollment set for this path session.
        delayDays:
          type: number
          description: The number of days to enroll the learner prior to the next due date.
          example: 90
      required:
      - type
      - delayDays
    PathEnrollmentDTO:
      title: Path Enrollment
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of the user enrollment.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        archivedAt:
          format: date-time
          type: string
          description: The date and time when the enrollment was archived from the path session, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        createdAt:
          format: date-time
          type: string
          description: The date and time when the learner enrolled to the path session, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        isSelfEnrolled:
          type: boolean
          description: True if the user self-enrolled in the given path session; false otherwise.
        modifiedAt:
          format: date-time
          type: string
          description: The date and time when the learner enrollment has been updated, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        sessionId:
          type: string
          description: The unique ID of the path session.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        status:
          type: string
          enum:
          - archived
          - published
          description: The status of the enrollment.
        userId:
          type: string
          description: The unique ID of the user.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
      required:
      - _id
      - createdAt
      - isSelfEnrolled
      - sessionId
      - status
      - userId
    AttendanceSheetsOptionDTO:
      title: Attendance Sheets Option
      type: object
      properties:
        unit:
          type: string
          enum:
          - day
          - slot
          description: 'The frequency at which attendance sheets are generated for each classroom slot. Options are:

            - `slot`: Generates the specified number of attendance sheet per classroom slot.

            - `day`: Generates the specified number of attendance sheets per day within the classroom slot.'
        number:
          type: number
          description: The number of attendance sheets per `day` or `slot`.
      required:
      - unit
      - number
    PathSessionWithoutTranslationsDTO:
      title: Path Session Without Translations
      type: object
      properties:
        mainInstructorId:
          type: string
          description: The unique ID of the main instructor of the path session.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        registrationRequestValidation:
          type: string
          enum:
          - disabled
          - instructors
          - managers
          - adminsAndManagers
          - adminsCoachesInstructorsManagers
          description: 'The registration request validation options for open access registrations. Options are:

            - `disabled`: There is no validation for registration.

            - `instructors`: The instructors validate the registration request.

            - `managers`: The managers validate the registration request.

            - `adminsAndManagers`: The managers and group admin validate the registration request.

            - `adminsCoachesInstructorsManagers`:Managers, instructors, group admins and coaches validate the registration request.'
        startDate:
          format: date-time
          type: string
          description: The date and time when the path session starts, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        endDate:
          format: date-time
          type: string
          description: The date and time when the path session ends, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        userLimit:
          type: integer
          minimum: 1
          description: The maximum number of learners that can self enroll in the path session.
        automaticReenrollment:
          oneOf:
          - $ref: '#/components/schemas/CertificationExpiryDateAutomaticReenrollmentDTO'
          - $ref: '#/components/schemas/PathCompletionDateAutomaticReenrollmentDTO'
          description: The automatic reenrollment settings if enabled for the path session.
        ipFiltering:
          description: The IP filtering configuration of the path session.
          allOf:
          - $ref: '#/components/schemas/IPFilteringDTO'
        _id:
          type: string
          description: The unique ID of the path session.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        createdAt:
          format: date-time
          type: string
          description: The date and time when the path session was created, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        groupId:
          type: string
          description: The unique ID of the path session owner group.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        instructorIds:
          description: The list of unique IDs of the co-instructors of the path session.
          example:
          - 507f1f77bcf86cd799439011
          type: array
          items:
            type: string
            format: ObjectId
            pattern: ^[a-fA-F0-9]{24}$
        isAudienceBuilder:
          type: boolean
          description: True if the path session is an audience builder session; false otherwise.
        modifiedAt:
          format: date-time
          type: string
          description: The date and time when the path session was last updated, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        name:
          type: string
          description: The title of the path session.
          example: Employee Onboarding October Session.
        pathId:
          type: string
          description: The unique ID of the path the session belongs to.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        additionalInformation:
          type: string
          description: The additional information of the path session.
          example: A0015221
        rootSessionId:
          type: string
          description: The unique ID of the root session.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
      required:
      - mainInstructorId
      - registrationRequestValidation
      - startDate
      - _id
      - createdAt
      - groupId
      - instructorIds
      - isAudienceBuilder
      - modifiedAt
      - name
      - pathId
    SelfRegistrationOptionDTO:
