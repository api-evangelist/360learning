    RelativeDateOptionDTO:
      title: Relative Date Option
      type: object
      properties:
        unit:
          type: string
          enum:
          - day
          - month
          - week
          description: The unit of measurement for the duration.
        value:
          type: number
          minimum: 0.01
          maximum: 1000
          description: The numerical estimate of the duration.
          example: 0.01
      required:
      - unit
      - value
    CertificationExpiryDateAutomaticReenrollmentDTO:
      title: Certification Expiry Date Automatic Reenrollment
