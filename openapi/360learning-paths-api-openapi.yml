    RegularCourseStepOptionsDTO:
      title: Regular Course Step Options
      type: object
      properties:
        optional:
          type: boolean
          description: True if the step is optional to complete the path; false otherwise.
        relativeDate:
          description: A soft deadline to encourage learners to complete the step on time, calculated from their enrollment date. Learners can still play the step after the relative due date.
          allOf:
          - $ref: '#/components/schemas/RelativeDateOptionDTO'
        showCorrection:
          type: string
          enum:
          - never
          - onAnswer
          - onCompletion
          - onSuccess
          description: 'When answers to questions will be displayed. Options are:

            - `never`: Answers will not be displayed at any time.

            - `onAnswer`: Answers will be displayed immediately after the learner provides their response.

            - `onCompletion`: Answers will be displayed only after the learner has completed the course.

            - `onSuccess`: Answers will be displayed only after the learner completes the course and meets the success criteria.'
        showForum:
          type: string
          enum:
          - never
          - onAnswer
          - onCompletion
          - onSuccess
          description: 'When the forum will be displayed. Options are:

            - `never`: The forum will not be displayed at any time.

            - `onAnswer`: The forum will be displayed immediately after the learner provides their response.

            - `onCompletion`: The forum will be displayed only after the learner has completed the course.

            - `onSuccess`: The forum will be displayed only after the learner completes the course and meets the success criteria.'
        timeLimit:
          description: The time required for learners to complete the step. Note that this parameter does not apply if the course is a SCORM module.
          allOf:
          - $ref: '#/components/schemas/TimeLimitOptionDTO'
        minScore:
          type: number
          minimum: 0
          maximum: 100
          description: The minimum score required to successfully complete the step. The score ranges from 0 to 100.
        attemptsLimit:
          type: number
          minimum: 1
          description: The maximum number of attempts allowed for the step. The learner cannot retry the step once this limit is reached.
          example: 1
        availability:
          description: The period during which the step is available to learners.
          allOf:
          - $ref: '#/components/schemas/AvailabilityOptionDTO'
      required:
      - optional
      - showCorrection
      - showForum
    PatchPathSessionDTO:
      title: Patch Path Session
      type: object
      properties:
        additionalInformation:
          type: string
          nullable: true
          description: The additional information of the path session.
          example: A0015221
          minLength: 1
        instructorIds:
          maxItems: 100
          description: The list of unique IDs of the co-instructors of the path session. The update of instructorIds modifies instructorIds in child path sessions.
          example:
          - 507f1f77bcf86cd799439011
          type: array
          items:
            type: string
            format: ObjectId
            pattern: ^[a-fA-F0-9]{24}$
        mainInstructorId:
          type: string
          description: The unique ID of the main instructor of the path session. The update of mainInstructorId modifies mainInstructorId in child path sessions.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        name:
          type: string
          description: The title of the path session.
          example: Employee Onboarding October Session.
          minLength: 1
        groupId:
          type: string
          description: The unique ID of the path session owner group.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        registrationRequestValidation:
          type: string
          enum:
          - disabled
          - instructors
          - managers
          - adminsAndManagers
          - adminsCoachesInstructorsManagers
          description: 'The registration request validation options for open access registrations. Options are:

            - `disabled`: There is no validation for registration.

            - `instructors`: The instructors validate the registration request.

            - `managers`: The managers validate the registration request.

            - `adminsAndManagers`: The managers and group admin validate the registration request.

            - `adminsCoachesInstructorsManagers`:Managers, instructors, group admins and coaches validate the registration request.'
        startDate:
          format: date-time
          type: string
          description: The date and time when the path session starts, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        endDate:
          format: date-time
          type: string
          nullable: true
          description: The date and time when the path session ends, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        userLimit:
          type: integer
          nullable: true
          minimum: 1
          description: The maximum number of learners that can self enroll in the path session.
        automaticReenrollment:
          oneOf:
          - $ref: '#/components/schemas/CertificationExpiryDateAutomaticReenrollmentDTO'
          - $ref: '#/components/schemas/PathCompletionDateAutomaticReenrollmentDTO'
          description: The automatic reenrollment settings if enabled for the path session.
          nullable: true
        ipFiltering:
          nullable: true
          description: The IP filtering configuration of the path session.
          allOf:
          - $ref: '#/components/schemas/IPFilteringDTO'
    ClassroomStepOptionsDTO:
      title: Classroom Step Options
      type: object
      properties:
        optional:
          type: boolean
          description: True if the step is optional to complete the path; false otherwise.
        relativeDate:
          description: A soft deadline to encourage learners to complete the step on time, calculated from their enrollment date. Learners can still play the step after the relative due date.
          allOf:
          - $ref: '#/components/schemas/RelativeDateOptionDTO'
        autoRegistration:
          type: boolean
          description: True if newly enrolled learners should be automatically registered in the next open classroom slot; false otherwise.
        selfRegistration:
          description: The options for learners self-registration.
          allOf:
          - $ref: '#/components/schemas/SelfRegistrationOptionDTO'
        attendanceSheets:
          description: 'The options for multiple attendance sheets in each classroom slot. For example:

            - If `unit` is set to `slot` and number is `2`, 2 attendance sheets will be generated for each classroom slot, regardless of the number of days in the slot.

            - If `unit` is set to `day` and number is `2` in a classroom slot lasting 3 days, 6 attendance sheets will be generated for the slot (2 sheets per day x 3 days).'
          allOf:
          - $ref: '#/components/schemas/AttendanceSheetsOptionDTO'
      required:
      - optional
      - autoRegistration
      - selfRegistration
