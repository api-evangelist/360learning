          description: 'When answers to questions will be displayed. Options are:

            - `never`: Answers will not be displayed at any time.

            - `onAnswer`: Answers will be displayed immediately after the learner provides their response.

            - `onCompletion`: Answers will be displayed only after the learner has completed the course.

            - `onSuccess`: Answers will be displayed only after the learner completes the course and meets the success criteria.'
        showForum:
          type: string
          enum:
          - never
          - onAnswer
          - onCompletion
          - onSuccess
          description: 'When the forum will be displayed. Options are:

            - `never`: The forum will not be displayed at any time.

            - `onAnswer`: The forum will be displayed immediately after the learner provides their response.

            - `onCompletion`: The forum will be displayed only after the learner has completed the course.

            - `onSuccess`: The forum will be displayed only after the learner completes the course and meets the success criteria.'
