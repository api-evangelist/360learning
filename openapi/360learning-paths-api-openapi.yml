          minLength: 1
        mainInstructorId:
          type: string
          description: The unique ID of the main instructor of the path session.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        instructorIds:
          maxItems: 100
          description: The list of unique IDs of the co-instructors of the path session.
          example:
          - 507f1f77bcf86cd799439011
          type: array
          items:
            type: string
            format: ObjectId
            pattern: ^[a-fA-F0-9]{24}$
    PutSessionAudienceDTO:
      title: Put Session Audience
      type: object
      properties:
        filters:
          maxItems: 3
          description: The list of filters in the audience. The maximum filters array size is 3.
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/SessionUsersAudienceFilterDTO'
            - $ref: '#/components/schemas/SessionGroupsAudienceFilterDTO'
            - $ref: '#/components/schemas/SessionExcludedLearnersAudienceFilterDTO'
        mode:
          type: string
          enum:
          - dynamic
          - dynamicEnrollment
          - dynamicUnenrollment
          - manual
          description: 'The audience builder update mode. Options are:

            - `dynamic`: Learners are dynamically enrolled and unenrolled.

            - `dynamicEnrollment`: Learners are dynamically enrolled.

            - `dynamicUnenrollment`: Learners are dynamically unenrolled.

            - `manual`: The audience is manually updated.'
