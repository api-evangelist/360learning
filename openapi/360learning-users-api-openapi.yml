components:
  schemas:
    ReplacePasswordBody:
      title: Replace Password Body
      type: object
      properties:
        password:
          type: string
          description: 'The new password of the given user. The new password must be at least 8 characters long and it might be subject to company based rules. Example: ''password'' : ''my_s3cret.PAssw0rd''.'
        passwordMustBeChanged:
          type: boolean
          description: True if the user must change their password when first logging into the platform; false otherwise.
      required:
      - password
      - passwordMustBeChanged
    UserDTO:
      title: User
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of the user.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        mail:
          type: string
          description: The email address of the user.
          example: john.smith@yopmail.com
          minLength: 1
        username:
          type: string
          description: The username that can be used to log in if the company allows it.
          example: johnsmith
          minLength: 1
        status:
          type: string
          enum:
          - active
          - invited
          - deleted
          description: The status of the user.
        lang:
          type: string
          enum:
          - bg
          - cs
          - da
          - de
          - el
          - en
          - es
          - fi
          - fr
          - hr
          - ht_HT
          - hu
          - id
          - it
          - ja
          - kar_MM
          - ko
          - lt
          - mh_MH
          - nl
          - nl_BE
          - 'no'
          - pl
          - pt
          - ro
          - ru
          - rw_RW
          - sk
          - sl
          - so_SO
          - sv
          - sw_KE
          - th
          - ti_ET
          - tr
          - uk
          - zh
          - vi
          description: The default language of the user, in a bigram format (en, fr, de, etc.).
        firstName:
          type: string
          description: The first name of the user.
          example: John
          minLength: 1
        lastName:
          type: string
          description: The last name of the user.
          example: Smith
          minLength: 1
        job:
          type: string
          description: The role title of the user.
          example: Engineer
          minLength: 1
        organization:
          type: string
          description: The organization that the user belongs to.
          example: 360Learning
          minLength: 1
        phone:
          type: string
          description: The phone number of the user.
          example: '+33123456789'
          minLength: 1
        custom:
          type: string
          description: The value of the **Additional information** field in the user’s profile. This is not the value of the custom fields associated with the user.
          example: Half-time worker
          minLength: 1
        deletedAt:
          description: The list of dates and times when the user’s profile was soft deleted, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
          type: array
          items:
            format: date-time
            type: string
        primaryGroupId:
          type: string
          description: The unique ID of the primary group of the user.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        reactivatedAt:
          description: The list of dates and times when the user’s profile was reactivated, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
          type: array
          items:
            format: date-time
            type: string
        lastLoginDate:
          format: date-time
          type: string
          description: The date and time when the user last logged in, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        toBeDeactivatedAt:
          format: date-time
          type: string
          description: The date and time when the user will be deactivated, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        profileImageId:
          type: string
          description: The unique ID of the profile image of the user.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
      required:
      - _id
      - status
      - lang
    CustomFieldValueDTO:
      title: Custom Field Value
      type: object
      properties:
        customFieldId:
          type: string
          description: The unique ID of the custom field.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        type:
          type: string
          enum:
          - string
          - date
          description: The type of the custom field.
        value:
          oneOf:
          - type: string
            title: string type
            description: The custom field string value.
            minLength: 1
            example: US
          - type: string
            title: date type
            format: date-time
            description: The custom field date value is in the `YYYY-MM-DD` (ISO 8601 in Coordinated Universal Time (UTC)).
            minLength: 1
            example: '2025-01-27'
          description: The value assigned to the target for this custom field.
      required:
      - customFieldId
      - type
      - value
    UploadUserMediaBodyDTO:
      title: Upload User Media Body
      type: object
      properties:
        profileImage:
          type: string
          format: binary
          description: 'The user profile image file. Recommended size: 256px × 256px. Maximum file size: 10MB. Supported media types: image/bmp, image/gif, image/heic, image/jpeg, image/png, image/svg+xml, image/webp.'
      required:
      - profileImage
    InputUserDTO:
      title: Input User
      type: object
      properties:
        mail:
          type: string
          description: The email address of the user. If not given, username must be given.
          example: john.smith@yopmail.com
          minLength: 1
        username:
          type: string
          description: The username that can be used to log in if the company allows it. If not given, mail must be given.
          example: johnsmith
          minLength: 1
        membership:
          description: The initial group membership of the user.
          allOf:
          - $ref: '#/components/schemas/MembershipDTO'
        primaryGroupId:
          type: string
