                  title: User Deleted
                  type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - userDeleted
                        message:
                          type: string
                          example: A human-readable message to help with debugging.
                      required:
                      - code
                      - message
                  required:
                  - error
                - description: The user corresponding to the given `userId` has no manager corresponding to the given `managerId`.
                  title: Manager Not Assigned To User
                  type: object
                  properties:
