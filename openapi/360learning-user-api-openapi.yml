components:
  schemas:
    UserInvitedDTO:
      title: User Invited
      type: object
      properties:
        userId:
          type: string
          description: The unique ID of the user.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        firstName:
          type: string
          description: The first name of the user.
          example: John
          minLength: 1
        lastName:
          type: string
          description: The last name of the user.
          example: Smith
          minLength: 1
        mail:
          type: string
          description: The email address of the user.
          example: john.smith@yopmail.com
          minLength: 1
        username:
          type: string
          description: The username that can be used to log in if the company allows it.
          example: johnsmith
          minLength: 1
        createdFrom:
          type: string
          enum:
          - selfRegistration
          description: Present and set to `"selfRegistration"` if the user registered via the self-registration form. Absent otherwise.
        invitedAt:
          format: date-time
          type: string
          description: The date and time when the user was invited, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
      required:
      - userId
      - invitedAt
    UserAssessmentCorrectedDTO:
      title: User Assessment Corrected
      type: object
      properties:
        userId:
          type: string
          description: The unique ID of the user whose assessment was corrected.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        assessmentId:
          type: string
          description: The unique ID of the assessment definition.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        name:
          type: string
          description: The name of the assessment.
          example: Final assessment
        pathId:
          type: string
          description: The unique ID of the path the assessment belongs to.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        sessionId:
          type: string
          description: The unique ID of the path session in which the assessment was taken.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        enrollmentId:
          type: string
          description: The unique ID of the user's enrollment that the assessment is tied to. Distinguishes assessments across multiple enrollments of the same user in the same session.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        success:
          type: boolean
          description: Whether the user passed (`true`) or failed (`false`) the assessment.
        score:
          type: number
          minimum: 0
          maximum: 100
          description: The score the user obtained, as a percentage between 0 and 100. Only present for scored assessments.
          example: 87
        correctedAt:
          format: date-time
          type: string
          description: The date and time when the assessment was corrected, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
      required:
      - userId
      - assessmentId
      - name
      - pathId
      - sessionId
      - enrollmentId
      - success
      - correctedAt
    UserCreatedDTO:
      title: User Created
      type: object
      properties:
        userId:
          type: string
          description: The unique ID of the user.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        firstName:
          type: string
          description: The first name of the user.
          example: John
          minLength: 1
        lastName:
          type: string
          description: The last name of the user.
          example: Smith
          minLength: 1
        mail:
          type: string
          description: The email address of the user.
          example: john.smith@yopmail.com
          minLength: 1
        username:
          type: string
          description: The username that can be used to log in if the company allows it.
          example: johnsmith
          minLength: 1
        createdAt:
          format: date-time
          type: string
          description: The date and time when the user was created, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
      required:
      - userId
      - createdAt
    UserUpdatedDTO:
      title: User Updated
      type: object
      properties:
        userId:
          type: string
          description: The unique ID of the user.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        firstName:
          type: string
          description: The first name of the user.
          example: John
          minLength: 1
        lastName:
          type: string
          description: The last name of the user.
          example: Smith
          minLength: 1
        mail:
          type: string
          description: The email address of the user.
          example: john.smith@yopmail.com
          minLength: 1
        username:
          type: string
          description: The username that can be used to log in if the company allows it.
          example: johnsmith
          minLength: 1
        updatedAt:
          format: date-time
          type: string
          description: The date and time when the user was updated, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        lang:
          type: string
          enum:
          - bg
          - cs
          - da
          - de
          - el
          - en
          - es
          - fi
          - fr
          - hr
          - ht_HT
          - hu
          - id
          - it
          - ja
          - kar_MM
          - ko
          - lt
          - mh_MH
          - nl
          - nl_BE
          - 'no'
          - pl
          - pt
          - ro
          - ru
          - rw_RW
          - sk
          - sl
          - so_SO
          - sv
          - sw_KE
          - th
          - ti_ET
          - tr
          - uk
          - zh
          - vi
          description: The default language of the user, in a bigram format (en, fr, de, etc.).
        custom:
          type: string
          description: The value of the **Additional information** field in the user's profile. This is not the value of the custom fields associated with the user.
          example: Half-time worker
          minLength: 1
        job:
          type: string
          description: The role title of the user.
          example: Software Engineer
          minLength: 1
        organization:
          type: string
          description: The organization that the user belongs to.
          example: 360Learning
          minLength: 1
        phone:
          type: string
          description: The phone number of the user.
          example: '+33123456789'
          minLength: 1
        toBeDeactivatedAt:
          format: date-time
          type: string
          description: The date and time when the user will be deactivated, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        primaryGroupId:
          type: string
          description: The unique ID of the primary group of the user.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
      required:
      - userId
      - updatedAt
    UserActivatedDTO:
      title: User Activated
      type: object
      properties:
        userId:
          type: string
          description: The unique ID of the user.
