        firstActivatedAt:
          format: date-time
          type: string
          description: The date and time when the user was activated for the first time, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
      required:
      - userId
      - firstActivatedAt
    UserDeletedDTO:
      title: User Deleted
