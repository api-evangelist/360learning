          description: The email address of the user.
          example: john.smith@yopmail.com
          minLength: 1
        username:
          type: string
          description: The username that can be used to log in if the company allows it.
          example: johnsmith
          minLength: 1
        deletedAt:
          format: date-time
          type: string
          description: The date and time when the user was soft deleted, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
      required:
      - userId
      - deletedAt
    UserReactivatedDTO:
      title: User Reactivated
      type: object
      properties:
        userId:
          type: string
          description: The unique ID of the user.
