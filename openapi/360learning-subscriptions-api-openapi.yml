                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - subscriptionNotFound
                      message:
                        type: string
                        example: A human-readable message to help with debugging.
                    required:
                    - code
                    - message
                required:
                - error
        '429':
          description: 'The client has sent too many requests in a short amount of time. '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - tooManyRequests
                required:
                - error
      security:
      - oauth2: []
      summary: Edit a webhook subscription
      tags:
      - Subscriptions
    servers:
    - url: https://app.360learning.com
      description: Production EU
    - url: https://app.us.360learning.com
      description: Production US
  /api/v2/webhooks/subscriptions/{subscriptionId}/events:
    get:
      description: '> 🔑

        >

        > Required OAuth scope: `webhooks:read`.


        > 📖

        >

        > This endpoint is paginated with a page size of 250 webhook events. For more information, see the [Pagination guide](doc:pagination).


        Lists all events for a given webhook subscription.'
      operationId: v2.webhook.subscriptions.GetEventsController_getEvents
      parameters:
      - name: 360-api-version
        in: header
        description: The version of the API.
        required: true
        schema:
          type: string
          enum:
          - v2.0
      - name: subscriptionId
        required: true
        in: path
        description: The unique ID of the webhook subscription.
        schema:
          format: ObjectId
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
          type: string
      - name: createdAt
        required: false
        in: query
        style: deepObject
        explode: true
        description: 'Filter on **createdAt** property with LHS bracket notation.


