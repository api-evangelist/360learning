          - path.session.classroom.slot.waitlist.user.joined
          - path.session.user.status.updated
          - path.session.users.enrolled
          - path.session.users.unenrolled
          - path.updated
          - user.activated
          - user.assessment.corrected
          - user.certificate.awarded
          - user.created
          - user.deleted
          - user.invited
          - user.reactivated
          - user.updated
          - xapi.started
          - xapi
