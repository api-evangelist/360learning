          description: The date and time when the classroom slot starts (must be before `endDate`), in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        endDate:
          format: date-time
          type: string
          description: The date and time when the classroom slot ends (must be after `startDate`), in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
        reportedDuration:
          type: number
          description: The reported duration of the slot, in hours.
          example: 1
        selfRegistration:
          oneOf:
          - $ref: '#/components/schemas/DisabledSelfRegistrationDTO'
          - $ref: '#/components/schemas/EnabledSelfRegistrationDTO'
          description: The self registration settings of the classroom slots.
        virtual:
          type: boolean
          description: True when the slot is a virtual classroom, false otherwise.
        maxCapacity:
          type: number
          description: The maximum number of registrations allowed in the slot. Learners won't be able to self-enroll on this slot if this number is reached.
          example: 10
        _id:
          type: string
          description: The unique ID of the classroom slot.
          format: ObjectId
          example: 507f1f77bcf86cd799439011
          pattern: ^[a-fA-F0-9]{24}$
        classroomId:
          type: string
          description: The unique ID of the classroom the slot is linked to.
