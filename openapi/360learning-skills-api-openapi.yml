      summary: List all skills
      tags:
      - Skills
  /api/v2/skills/users/{userId}/jobs:
    put:
      description: '> 🔑

        >

        > Required OAuth scope: `skillsJobs:write`.


        Replaces all jobs for the given user with the provided ones. Jobs not included are removed.'
      operationId: v2.skills.ReplaceUserJobsController_replaceUserJobs
      parameters:
      - name: 360-api-version
        in: header
        description: The version of the API.
        required: true
        schema:
          type: string
          enum:
          - v2.0
      - name: userId
        required: true
        in: path
        description: The unique ID of a user.
        schema:
          format: ObjectId
          pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439011
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceUserJobsBody'
      responses:
        '200':
          description: Returns the current jobs of the user.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: The server cannot or will not process the request due to something that is perceived to be a client error.
          content:
            application/json:
              schema:
                oneOf:
                - description: The skill solution is not enabled.
                  title: Skill Solution Not Enabled
                  type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - skillSolutionNotEnabled
                        message:
                          type: string
                          example: A human-readable message to help with debugging.
                      required:
                      - code
                      - message
                  required:
                  - error
                - description: Job externalId not found.
                  title: Job External Id Not Found
                  type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - jobExternalIdNotFound
                        message:
                          type: string
                          example: A human-readable message to help with debugging.
                      required:
                      - code
                      - message
                  required:
                  - error
                - description: Too many jobs for a user.
                  title: Too Many Jobs
                  type: object
                  properties:
                    error:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - tooManyJobs
                        message:
                          type: string
                          example: A human-readable message to help with debugging.
                      required:
                      - code
                      - message
                  required:
                  - error
        '401':
          description: The given access token is either missing, invalid, has expired, or has been revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - invalid_token
                required:
                - error
        '403':
          description: The given access token does not have the required OAuth scope to execute the request.
          content:
            application/json:
              schema:
                title: Invalid Scope
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - invalid_scope
                      message:
                        type: string
                        example: A human-readable message to help with debugging.
                    required:
                    - code
                    - message
                required:
                - error
        '404':
          description: The given user does not correspond to any existing and non-deleted user.
          content:
            application/json:
              schema:
                title: User Not Found
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - userNotFound
                      message:
                        type: string
                        example: A human-readable message to help with debugging.
                    required:
                    - code
                    - message
                required:
                - error
        '429':
          description: 'The client has sent too many requests in a short amount of time. '
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - tooManyRequests
                required:
                - error
      security:
      - oauth2: []
      summary: Replace all jobs for a user
      tags:
      - Skills
components:
  schemas:
    SkillAddedDTO:
      title: Skill Added
      type: object
      properties:
        externalId:
          type: string
          description: The unique external ID of the review.
          example: 5d9b7bf9-47bf-40ca-b670-2a2a80d992da
          minLength: 1
        userId:
          type: string
          description: The unique ID of the user the review is about.
          example: 672b473e3e8d1c8cee0f1a4b
          minLength: 1
          format: ObjectId
          pattern: ^[a-fA-F0-9]{24}$
        assessorId:
          type: string
          description: The unique ID of the user that made the review.
          example: 672b47e33e8d1c8cee0f1a5c
          minLength: 1
          format: ObjectId
          pattern: ^[a-fA-F0-9]{24}$
        skillId:
          type: string
          description: The unique ID of the skill the review is about.
          example: SKI1708592191403r2x5
          minLength: 1
        actionType:
          type: string
          enum:
          - skillAdded
          description: The skill is added to the user profile.
        comment:
          type: string
          maxLength: 1000
          description: A comment about the review.
          example: You demonstrated a good understanding of the topic.
          minLength: 1
        createdAt:
          format: date-time
          type: string
          description: The date and time of the review, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)). If not set, the current date is used.
          minLength: 1
      required:
      - userId
      - assessorId
      - skillId
      - actionType
    SingleChoiceQualifierDTO:
      title: Single Choice Qualifier
      type: object
