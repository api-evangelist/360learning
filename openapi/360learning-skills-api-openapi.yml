          minLength: 1
    ReplaceUserJobsBody:
      title: Replace User Jobs Body
      type: object
      properties:
        jobIds:
          description: The list of unique IDs of the current jobs given to a user.
          type: array
          items:
            type: string
      required:
      - jobIds
    ReplaceUserJobsDTO:
      title: Replace User Jobs
      type: object
      properties:
        userId:
          type: string
          description: The unique ID of the user the jobs are associated to.
          example: 672b473e3e8d1c8cee0f1a4b
          minLength: 1
          format: ObjectId
          pattern: ^[a-fA-F0-9]{24}$
        currentJobIds:
          description: The list of unique IDs of the current jobs given to the user. Do not include the property to keep existing jobs. Send empty list ([]) to remove all corresponding jobs
          example:
          - JOB1
          - JOB2
          type: array
          items:
            type: string
        targetJobIds:
          description: The list of unique IDs of the target jobs given to the user. Do not include the property to keep existing jobs. Send empty list ([]) to remove all corresponding jobs
          example:
          - JOB3
          - JOB4
          type: array
          items:
            type: string
        previousJobIds:
          description: The list of unique IDs of the previous jobs given to the user. Do not include the property to keep existing jobs. Send empty list ([]) to remove all corresponding jobs
          example:
          - JOB5
          - JOB6
          type: array
          items:
            type: string
      required:
      - userId
    SkillDeleteDTO:
      title: Skill Delete
      type: object
      properties:
        externalId:
          type: string
          description: The unique external ID of the skill.
          example: 5d9b7bf9-47bf-40ca-b670-2a2a80d992da
          minLength: 1
      required:
      - externalId
    TextQualifierDTO:
      title: Text Qualifier
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of the qualifier.
          example: SKQ1701914859202x53r
        type:
          type: string
          enum:
          - text
          description: The type of the qualifier.
        currentValue:
          type: string
          description: The current value of the qualifier.
          example: 'The user still need to improve some aspects of the skill. '
      required:
      - _id
    DeleteJobsBody:
      title: Delete Jobs Body
      type: object
      properties:
        input:
          description: An array of job delete objects.
          maxItems: 10000
          type: array
          items:
            $ref: '#/components/schemas/JobDeleteDTO'
      required:
      - input
    JobTranslationDTO:
      title: Job Translation
      type: object
      properties:
        lang:
          type: string
          enum:
          - bg
          - cs
          - de
          - en
          - es
          - fr
          - hu
          - it
          - ja
          - nl
          - pl
          - pt
          - ro
          - ru
          - sa
          - tr
          - uk
          - vm
          - zh
          description: The language of the translation.
          example: fr
        translatedFields:
          description: The translations of the job fields for this language.
          allOf:
          - $ref: '#/components/schemas/JobTranslatedFieldsDTO'
      required:
      - lang
      - translatedFields
    ReplaceUsersJobsBody:
      title: Replace Users Jobs Body
      type: object
      properties:
        input:
          description: An array of jobs by user and status.
          maxItems: 10000
          type: array
          items:
            $ref: '#/components/schemas/ReplaceUserJobsDTO'
      required:
      - input
    UpsertJobsBody:
      title: Upsert Jobs Body
      type: object
      properties:
        input:
          description: An array of job upsert objects.
          maxItems: 10000
          type: array
          items:
            $ref: '#/components/schemas/JobUpsertDTO'
      required:
      - input
    ValueByIdQualifierDTO:
      title: Value By Id Qualifier
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of the qualifier.
          example: SKQ1701914859202x53r
          minLength: 1
        valueId:
          type: string
          description: The unique ID of the qualifier value.
          example: 5wQSd5xljil5zndlsieqA5
          minLength: 1
      required:
      - _id
      - valueId
    NumberQualifierDTO:
      title: Number Qualifier
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of the qualifier.
          example: SKQ1701914859202x53r
        type:
          type: string
          enum:
          - number
          description: The type of the qualifier.
        currentValue:
          type: number
          description: The current value of the qualifier.
          example: 10
      required:
      - _id
    SkillDTO:
      title: Skill
      type: object
      properties:
        _id:
          type: string
          description: The unique ID of the skill.
          example: SKI1234567890123abcDE
        name:
          type: string
          description: The name of the skill.
          example: Releases and deployments
        parents:
          description: The parent skills and libraries.
          type: array
          items:
            $ref: '#/components/schemas/SkillParentDTO'
        status:
          type: string
          enum:
          - archived
          - published
          description: The status of the skill.
          example: published
        translations:
          description: The different translations available for the skill.
          type: array
          items:
            $ref: '#/components/schemas/SkillTranslationDTO'
        externalId:
          type: string
          description: The unique external ID of the skill.
          example: 5d9b7bf9-47bf-40ca-b670-2a2a80d992da
        description:
          type: string
          description: The description of the skill.
          example: Did the user already release the software on the production environment?
        libraryId:
          type: string
          description: The ID of the library that contains the skill.
          example: 6b14f596-b5dd-40bf-af4c-a4270487a3c4
        createdAt:
          format: date-time
          type: string
          description: The creation date of the skill, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
          example: '2024-01-01T10:00:00.000Z'
        updatedAt:
          format: date-time
          type: string
          description: The last update date of the skill, in the `YYYY-MM-DDThh:mm:ss.sssZ` format (ISO 8601 in Coordinated Universal Time (UTC)).
          example: '2024-01-02T08:00:00.000Z'
      required:
      - _id
      - name
      - parents
      - status
      - translations
  securitySchemes:
    oauth2:
      type: oauth2
      flows: {}
      description: 'Use the token from the authentication endpoint in the Authorization header.


        Example: `Authorization: Bearer <token>`'
