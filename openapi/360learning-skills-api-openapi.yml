          - singleChoice
          description: The type of the qualifier.
        currentValue:
          type: string
          description: The current value of the qualifier.
          example: Intermediate
        currentValueId:
          type: string
          description: The unique ID of the current value of the qualifier.
          example: clgz9uqmm0001357bbgggvr1m
      required:
      - _id
    ValueByIndexQualifierDTO:
