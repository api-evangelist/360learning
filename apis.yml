aid: 360learning
name: 360Learning
description: >-
  360Learning is a collaborative learning platform (LMS) that blends top-down
  and peer-to-peer "Collaborative Learning" to help enterprises upskill and train
  employees, customers, and partners at scale. Its REST API v2 lets developers
  automate the platform: provision and activate users, organize them into groups,
  build and assign courses and learning paths, schedule instructor-led classrooms
  with slots and attendance, manage a skills taxonomy and certificates, run bulk
  operations, and subscribe to near-real-time webhook events. API v2 uses OAuth
  2.0 client-credentials auth with a two-tier (company/credential) scope system,
  cursor pagination via the Link header, and is hosted in EU and US regions.
